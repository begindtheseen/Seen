  api.fillList('requisitionDescriptionInterface', 'descRequisition', ['36524','true','36524','false','Submission for the position: VR Business Systems Trainer (Statewide) - (Job Number: 827327)','false','36524','false','true','VR Business Systems Trainer (Statewide)','827327','!*!%3Cp%3EWHO WE ARE:%26nbsp;%3Cbr%3ETexas Workforce Commission connects people with careers across the state. While we are based in Austin on the north lawn of the Texas State Capitol, we have offices statewide. We are looking for a VR Business Systems Trainer (Systems Analyst IV) to work in the Vocational Rehabilitation, Business Systems department. We%27re a Family Friendly Certified Workplace with great work-life balance, competitive salaries, extensive opportunities for training and development, and fantastic benefits.%26nbsp;While our main office is located at 1117 Trinity St, Austin, Texas, this position can be located at any one of the VR offices statewide.%3Cbr%3E%3Cbr%3ETWC is not considering applications from individuals who require sponsorship for an employment visa, including those with H1B visas or those currently on student or postgraduate visas. You must be a Texas resident to work for the Texas Workforce Commission or willing to relocate to Texas.%3Cbr%3E%3Cbr%3EWHO YOU ARE:%26nbsp;%3Cbr%3EA seasoned training professional and technical expert eager to provide advanced consultative services and system-driven solutions. You are adept at analyzing complex workflows, developing comprehensive instructional materials, and helping staff master critical Vocational Rehabilitation (VR) applications. You thrive in an environment where you can apply your expertise in instructional design and system analysis to enhance user proficiency. You are an initiative-taker, a thoughtful problem-solver, and a clear communicator, committed to driving user adoption and ensuring program compliance across the organization.%3Cbr%3E%3Cbr%3EWHAT YOU WILL DO:%26nbsp;%3Cbr%3EThe VR Business Systems Trainer (Systems Analyst IV) performs highly advanced (senior-level) consultative services and technical assistance work. Work involves planning, developing, and implementing major agency programs by providing expert consultative services to program staff and stakeholders. This role specializes in the analysis, development, and delivery of comprehensive training programs and support resources designed to enhance the use and effectiveness of critical VR systems, such as ReHabWorks (RHW). May serve as a lead worker providing direction to others. Works under minimal supervision, with considerable latitude for the use of initiative and independent judgment.%3Cbr%3E%3Cbr%3EYOU WILL BE TRUSTED TO:%3Cbr%3E-Plan, develop, and deliver comprehensive training programs and support resources for assigned agency systems (e.g., ReHabWorks).%3Cbr%3E-Perform ongoing needs assessments and program analysis to identify knowledge gaps and create efficiencies by improving user proficiency and workflows.%3Cbr%3E-Develop and maintain a comprehensive library of support resources—including user manuals, job aids, and tutorials—by analyzing user feedback, system updates, and policy changes.%3Cbr%3E-Monitor and evaluate the effectiveness of training programs through performance reports and user surveys, implementing data-driven enhancements to curriculum.%3Cbr%3E-Ensure user compliance with program policies and rules by designing and embedding these standards directly into training content and system documentation.%3Cbr%3E-Serve as a Subject Matter Expert (SME), interpreting complex policies and translating them into practical, step-by-step guidance for system users.%3Cbr%3E-Analyze the impact of new legislation and policy changes on system functionality to proactively update training materials.%3Cbr%3E-Collaborate with management on change management initiatives, leading the training and communication strategies for new systems and procedures.%3Cbr%3E%3Cbr%3EYOU QUALIFY WITH:%3Cbr%3E-Four years of full-time experience in positions that provided knowledge of training methods, techniques, and materials as related to individual development, education, and training programs; or in positions that provided knowledge of agency operation or programs which included giving group presentations.%3Cbr%3E-Relevant academic credits may be applied toward experience qualifications for this position.%3Cbr%3E%3Cbr%3EYOU ARE A GREAT FIT WITH:%3Cbr%3E-Knowledge of: Training procedures and techniques; Learning Management Systems (LMS) and content management systems; group processes and interpersonal relations; and instructional/curriculum design.%3Cbr%3E-Skill in: Oral and written communication; instructing others and facilitating workshops; and using a computer and applicable software.%3Cbr%3E-Ability to: Formulate and develop learning objectives; assess training needs and evaluate training effectiveness; communicate effectively; and supervise the work of others.%3Cbr%3E%3Cbr%3EYOU GAIN:%26nbsp;%3Cbr%3E-A Family Friendly Certified Workplace.%26nbsp;%3Cbr%3E-Competitive starting salary:%26nbsp;%246,702.75-%247,503.25/month%3Cbr%3E-Defined Retirement Benefit Plan.%3Cbr%3E-Optional 401(k) and 457 accounts.%3Cbr%3E-Medical Insurance.%3Cbr%3E-Paid time off, including time for vacation, sick and family care leave.%26nbsp;%3Cbr%3E-Additional benefits for active employees can be found at %3Ca href=%22https://www.ers.texas.gov/Active-Employees/Health-Benefits.%22%3Ehttps://www.ers.texas.gov/Active-Employees/Health-Benefits.%3C/a%3E%3Cbr%3E%3Cbr%3EVETERANS:%26nbsp;%3Cbr%3EUse your military skills to qualify for this position or other jobs! Go to %3Ca href=%22https://www.texasskillstowork.com%22%3Ewww.texasskillstowork.com%3C/a%3E to translate your military work experience and training courses into civilian job terms, qualifications, and skill sets. Also, you can compare this position to military occupations (MOS) at the Texas State Auditor%27s Office by pasting this link into your browser: %3
