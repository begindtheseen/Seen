   "description" : "\u003cp\u003eSpaceX was founded under the belief that a future where humanity is out exploring the stars is fundamentally more exciting than one where we are not. Today SpaceX is actively developing the technologies to make this possible, with the ultimate goal of enabling human life on Mars.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eELECTRICIAN, SOLAR CELLS (STARLINK) - DAY SHIFT\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAt SpaceX, we are building the next generation of space infrastructure to enable large-scale AI data centers in orbit. These orbital AI platforms require massive amounts of reliable, high-efficiency solar power to support intensive computing workloads in space. To make this possible, we are standing up one of the largest solar cell manufacturing facilities in the world. We are seeking an Electrician to install, maintain, and repair electrical distribution, controls, and power systems for both facility infrastructure and solar cell production equipment.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRESPONSIBILITIES:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInstall, maintain, and repair electrical distribution, controls, lighting, and power systems for facility infrastructure and production equipment\u003c/li\u003e\n\u003cli\u003eSupport power systems for cleanroom tools, utility equipment, and process areas including PECVD, PVD, texturing, and metallization lines\u003c/li\u003e\n\u003cli\u003ePerform preventive and corrective maintenance on electrical systems to ensure reliability and minimal downtime\u003c/li\u003e\n\u003cli\u003eTroubleshoot electrical issues down to the component level using schematics and diagnostic tools\u003c/li\u003e\n\u003cli\u003eCollaborate with facilities and production teams to develop and follow work instructions and safety procedures\u003c/li\u003e\n\u003cli\u003eEnsure compliance with National Electrical Code (NEC), OSHA, and all applicable safety standards\u003c/li\u003e\n\u003cli\u003eParticipate in continuous improvement initiatives for electrical system performance and energy efficiency\u003c/li\u003e\n\u003cli\u003eOpen and resolve electronic work tickets and maintain accurate documentation\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eBASIC QUALIFICATIONS:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHigh school diploma or equivalency certificate\u003c/li\u003e\n\u003cli\u003e3+ years of professional experience as a licensed or certified electrician in an industrial or manufacturing setting\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003ePREFERRED SKILLS AND EXPERIENCE:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eJourneyman or master electrician license\u003c/li\u003e\n\u003cli\u003eExperience with industrial electrical systems, controls, and power distribution in cleanroom or high-tech manufacturing environments\u003c/li\u003e\n\u003cli\u003eStrong troubleshooting skills and ability to read and interpret electrical schematics, P\u0026amp;IDs, and blueprints\u003c/li\u003e\n\u003cli\u003eExperience supporting high-volume production equipment and utility systems\u003c/li\u003e\n\u003cli\u003eFamiliarity with cleanroom protocols and gowning procedures\u003c/li\u003e\n\u003cli\u003eExcellent communication skills and ability to work collaboratively in a fast-paced environment\u003c/li\u003e\n\u003cli\u003eExperience with lock-out/tag-out, job hazard analysis, and chemical safety protocols\u003c/li\u003e\n\u003cli\u003eProficiency with Microsoft Office tools and executing digital work instructions\u003c/li\u003e\n\u003cli\u003eDemonstrated punctuality, ability to work in a high-stress environment, and flexibility to adjust priorities\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eADDITIONAL REQUIREMENTS:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAbility to stand up to 6 hours, lift up to 25 pounds unassisted, and maneuver around equipment in a factory setting\u003c/li\u003e\n\u003cli\u003eAbility to work in industrial environments with fumes/odors, noise, hazardous chemicals, and confined spaces\u003c/li\u003e\n\u003cli\u003eMust be available for one of the following AWS shifts (start and end times are approximate):\n\u003cul\u003e\n\u003cli\u003eA Shift – 5:00am-5:00pm, Sunday-Wednesday\u003c/li\u003e\n\u003cli\u003eB Shift – 5:00am-5:00pm, Wednesday-Saturday\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eITAR REQUIREMENTS:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTo conform to U.S. Government export regulations, applicant must be a (i) U.S. citizen or national, (ii) U.S. lawful, permanent resident (aka green card holder), (iii) Refugee under 8 U.S.C. § 1157, or (iv) Asylee under 8 U.S.C. § 1158, or be eligible to obtain the required authorizations from the U.S. Department of State. Learn more about the ITAR here. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSpaceX is an Equal Opportunity Employer; employment with SpaceX is governed on the basis of merit, competence and qualifications and will not be influenced in any manner by race, color, religion, gender, national origin/ethnicity, veteran status, disability status, age, sexual orientation, gender identity, marital status, mental or physical disability or any other legally protected status.\u003c/p\u003e\n\u003cp\u003eApplicants wishing to view a copy of SpaceX’s Affirmative Action Plan for veterans and individuals with disabilities, or applicants requiring reasonable accommodation to the application/interview process should reach out to EEOCompliance@spacex.com\u003cem\u003e. \u003c/em\u003e\u003c/p\u003e",
