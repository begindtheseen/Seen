 all quality, safety, health and environmental policies, procedures, programs and regulations\u003c/li\u003e\n\u003cli\u003eMust complete Short Service Employee (SSE) program for the position, to familiarize with Cactus requirements and specifications\u003c/li\u003e\n\u003cli\u003eInspect, operate and test completed products to verify functioning and conformance to requirements\u003c/li\u003e\n\u003cli\u003ePosition and/or align components for assembly, manually or using hoists\u003c/li\u003e\n\u003cli\u003eVerify parts clearances and fit up\u003c/li\u003e\n\u003cli\u003eAdjust, repair, rework or replace parts and assemblies to eliminate malfunctions and to ensure proper operation\u003c/li\u003e\n\u003cli\u003eRead and interpret assembly drawings or operation manuals\u003c/li\u003e\n\u003cli\u003eMaintain and lubricate parts or components\u003c/li\u003e\n\u003cli\u003eRemove rough spots and smooth surfaces to fit, trim or clean parts, use of hand tools or power tools\u003c/li\u003e\n\u003cli\u003ePerform other regular duties as assigned or requested\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEducation, Training, Experience\u003c/strong\u003e\u003cstrong\u003e: \u003c/strong\u003eHigh School diploma or general education degree (GED); or a minimum of 0-2 years related experience and/or training; or equivalent combination of education and experience.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCertifications, Licenses, Registrations\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e None required.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJob Knowledge, Skills, Abilities:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAbility to read and understand detailed instruction drawings and specifications on wellhead equipment and valves.\u003c/li\u003e\n\u003cli\u003eKnowledge of good document control and process flow\u003c/li\u003e\n\u003cli\u003eKnowledge of how parts are assembled tested and painted and the tools and equipment used to accomplish it.\u003c/li\u003e\n\u003cli\u003eKnowledge of Quality System\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSupervisory Responsibilities\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e \u0026nbsp;This job has no supervisory responsibilities.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003eDisclaimer: \u003c/em\u003e\u003c/strong\u003e\u003cem\u003eThis job description is not designed to cover or contain a comprehensive listing of activities, duties, or responsibilities required of the employee for this position. Duties, responsibilities, and activities may change at any time with or without notice.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCactus Companies is an Equal Opportunity Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, age, national origin, disability, veteran status, genetic information, or any other characteristic protected by law. Safety is our top priority. All employees must comply with our comprehensive safety programs, participate in required safety training, and demonstrate commitment to our safety-first culture. \u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003eThis position operates in an industrial/field environment. The role requires working in and around manufacturing equipment, heavy machinery, and potentially hazardous materials. While performing the duties of this job, the employee:\u003
