name: Secret Scan

# Scans every push and PR for hardcoded secrets (API keys, tokens, the Supabase
# service_role key, Stripe keys, etc.) with TruffleHog OSS. TruffleHog verifies
# candidate credentials against their live provider where it can, so the signal
# is high — a "verified" hit is an active, exploitable secret and fails the job.
#
# Reminder for this repo: the Supabase ANON key is intentionally public (RLS
# protects it), so it is expected to appear in the client bundle. The
# service_role key must NEVER be committed or exposed via a NEXT_PUBLIC_* var —
# that is exactly what this job exists to catch.
on:
  push:
    branches: [next-migration]
  pull_request:
    branches: [next-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan can diff the whole push range, not just the
          # tip commit (fetch-depth 0 is required by the TruffleHog action).
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan the checked-out repository. The action auto-detects the commit
          # range for push/PR events; on a full-history checkout it scans the
          # branch. --results=verified,unknown reports confirmed live secrets and
          # unverifiable candidates while suppressing known-safe false positives.
          extra_args: --results=verified,unknown
