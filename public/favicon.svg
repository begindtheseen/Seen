<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Seen favicon — the brand "signal" mark: dark tile, indigo ring, green pulse dot.
       Mirrors .logo-pulse / the hero eyebrow dot. Pure shapes (no text, no filters)
       so it stays crisp at 16px. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070f"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <!-- Outer signal ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="80 27" transform="rotate(-45 32 32)"/>
  <!-- Soft green halo + core dot -->
  <circle cx="32" cy="32" r="15" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="7" fill="#10b981"/>
  <circle cx="29.6" cy="29.6" r="2.2" fill="#ffffff" fill-opacity="0.5"/>
</svg>
